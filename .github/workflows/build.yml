name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project if uploaded as zip
        run: |
          if [ -f HavaSaat.zip ]; then unzip -o HavaSaat.zip -d . ; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HavaSaat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HavaSaat
          path: HavaSaat.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hava & Saat
          files: HavaSaat.apk
          make_latest: true
